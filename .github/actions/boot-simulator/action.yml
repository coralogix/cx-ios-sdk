name: Boot iOS Simulator
description: >-
  Pick an available iPhone simulator with simctl and start booting it. Replaces
  the `xcodebuild -showdestinations` probe, which resolves the whole SPM graph
  just to list devices (~80s) before a blind `boot` + `sleep`.

inputs:
  device:
    description: >-
      Preferred device, matched as a regex against the device name. Anchor it —
      an unanchored "iPhone 16" also matches 16 Plus, 16 Pro, 16 Pro Max and 16e,
      and the gesture tests are sensitive to screen size. Falls back to any
      iPhone, deterministically, if nothing matches.
    required: false
    default: '^iPhone 16$'
  runtime:
    description: >-
      Pin the iOS runtime, matched against the SimRuntime identifier (e.g.
      "18-5"). A pin is honoured strictly — if no simulator has that runtime the
      action fails rather than substituting another, since silently accepting
      26-2 while refusing 18-6 would make the pin meaningless.
      Leave empty to derive it from the selected Xcode's simulator SDK,
      which is what the old `xcodebuild -showdestinations` probe did implicitly:
      a runner can carry runtimes newer than the SDK (18.6, 26.x alongside an
      18.5 SDK) and picking one of those fails at launch.
    required: false
    default: ''
  boot:
    description: >-
      Boot the simulator here. Set to 'false' to only resolve the device —
      appropriate for `xcodebuild test`, which boots the destination itself, so
      booting first only serialises work it already does internally. The shards
      run `test-without-building` and do want the boot started early.
    required: false
    default: 'true'
  wait:
    description: >-
      Block until the simulator finishes booting. Set to 'false' to overlap the
      boot with later setup steps, then join with `xcrun simctl bootstatus
      "$SIM_UDID" -b` once that setup is done.
    required: false
    default: 'true'

outputs:
  udid:
    description: UDID of the selected simulator.
    value: ${{ steps.pick.outputs.udid }}
  destination:
    description: An xcodebuild -destination string for the selected simulator.
    value: ${{ steps.pick.outputs.destination }}

runs:
  using: composite
  steps:
    - name: Pick and boot a simulator
      id: pick
      shell: bash
      env:
        WANT_DEVICE: ${{ inputs.device }}
        WANT_RUNTIME: ${{ inputs.runtime }}
        WANT_WAIT: ${{ inputs.wait }}
        WANT_BOOT: ${{ inputs.boot }}
      run: |
        set -euo pipefail
        DEVICES=$(xcrun simctl list devices available -j)

        # e.g. SDK 18.5 -> "18-5" (exact) and "18-" (same major).
        SDK_VER=$(xcrun --sdk iphonesimulator --show-sdk-version 2>/dev/null || echo "")
        # Full regexes, not fragments: jq matches them against the whole
        # SimRuntime identifier, so the trailing anchor has to be part of them.
        RT_PREFIX='SimRuntime\.iOS-'
        PINNED=false
        if [ -n "$WANT_RUNTIME" ]; then
          # A caller-supplied runtime is a constraint, not a preference: anchor
          # it so a suffixed identifier cannot satisfy it, and skip the
          # broadening fallbacks entirely.
          EXACT="${RT_PREFIX}${WANT_RUNTIME}$"; MAJOR="$EXACT"; PINNED=true
        elif [ -n "$SDK_VER" ]; then
          EXACT="${RT_PREFIX}${SDK_VER//./-}$"; MAJOR="${RT_PREFIX}${SDK_VER%%.*}-"
        else
          EXACT=""; MAJOR="${RT_PREFIX}[0-9]"
        fi
        echo "simulator SDK: ${SDK_VER:-unknown}" 

        # Newest runtime first (field 1, version-sorted so iOS-18-10 beats
        # iOS-18-9), then highest device name (field 3). Sorting the whole line
        # instead made the UDID the tiebreaker, which picked an arbitrary model
        # out of the matches.
        pick() {
          echo "$DEVICES" | jq -r --arg rt "$1" --arg dev "$2" '
            .devices | to_entries[]
            | select(.key | test($rt))
            | .key as $runtime
            | .value[]
            | select(.isAvailable != false)
            | select(.name | test($dev))
            | "\($runtime)\t\(.udid)\t\(.name)"' \
          | sort -t"$(printf '\t')" -k1,1V -k3,3 | tail -1
        }

        # Narrowest first. Each fallback is announced so a silent downgrade onto
        # an SDK-incompatible runtime cannot pass unnoticed.
        MATCH=""
        if [ -n "$EXACT" ]; then
          MATCH=$(pick "$EXACT" "$WANT_DEVICE")
          if [ -z "$MATCH" ]; then
            # Announce this: silently booting a different model is the
            # non-determinism the anchored default exists to prevent, and screen
            # size changes how the gesture tests behave.
            MATCH=$(pick "$EXACT" "iPhone")
            [ -n "$MATCH" ] && echo "::warning::No simulator matching '$WANT_DEVICE'; using $(echo "$MATCH" | cut -f3) instead."
          fi
        fi
        if [ "$PINNED" = true ]; then
          if [ -z "$MATCH" ]; then
            echo "::error::runtime '$WANT_RUNTIME' was pinned but no matching iPhone simulator is available."
            xcrun simctl list devices available || true
            exit 1
          fi
        else
          if [ -z "$MATCH" ]; then
            MATCH=$(pick "$MAJOR" "iPhone")
            [ -n "$MATCH" ] && echo "::warning::No iOS ${SDK_VER:-?} simulator; falling back within the same major version."
          fi
          if [ -z "$MATCH" ]; then
            MATCH=$(pick "${RT_PREFIX}[0-9]" "iPhone")
            [ -n "$MATCH" ] && echo "::warning::No simulator matching the ${SDK_VER:-?} SDK; using any available iOS runtime. Tests may fail to launch."
          fi
          if [ -z "$MATCH" ]; then
            echo "::error::No available iPhone simulator found."
            xcrun simctl list devices available || true
            exit 1
          fi
        fi

        UDID=$(echo "$MATCH" | cut -f2)
        NAME=$(echo "$MATCH" | cut -f3)
        RUNTIME=$(echo "$MATCH" | cut -f1 | sed 's/.*SimRuntime\.iOS-//; s/-/./g')

        echo "Selected $NAME (iOS $RUNTIME) — $UDID"
        echo "udid=$UDID" >> "$GITHUB_OUTPUT"
        echo "destination=platform=iOS Simulator,id=$UDID" >> "$GITHUB_OUTPUT"
        echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
        echo "SIM_DESTINATION=platform=iOS Simulator,id=$UDID" >> "$GITHUB_ENV"

        # `simctl boot` blocks until the device is up (~80s cold), so with
        # wait=false it must be detached or there is no overlap to be had — the
        # caller would pay the boot here AND again in `bootstatus`. CoreSimulator
        # continues the boot even if this client is reaped, and `bootstatus -b`
        # re-boots if it somehow did not start. Already-booted is not an error.
        if [ "${WANT_BOOT}" != "true" ]; then
          echo "boot skipped — xcodebuild will boot this destination itself"
        elif [ "${WANT_WAIT}" = "true" ]; then
          xcrun simctl boot "$UDID" 2>/dev/null || true
        else
          nohup xcrun simctl boot "$UDID" >/dev/null 2>&1 &
          echo "boot detached — join it with: xcrun simctl bootstatus \"\$SIM_UDID\" -b"
        fi

    - name: Wait for boot
      if: inputs.wait == 'true' && inputs.boot == 'true'
      shell: bash
      run: xcrun simctl bootstatus "${{ steps.pick.outputs.udid }}" -b
