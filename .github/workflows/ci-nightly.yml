name: Nightly

# The soak tier: leak and performance probes that are too slow, and too prone to
# environment-driven noise, to gate a pull request. Keeping them here is what the
# ui-tests.yml comment referring to CX-45948 always intended.

on:
  schedule:
    # 02:00 UTC, weekdays — results are waiting at the start of the working day.
    - cron: '0 2 * * 1-5'
  workflow_dispatch:
    inputs:
      tiers:
        description: 'Tiers to run, as a JSON array.'
        type: string
        default: '["soak"]'

permissions:
  contents: read

jobs:
  soak:
    uses: ./.github/workflows/ci-ui-tests.yml
    with:
      tiers: ${{ inputs.tiers || '["soak"]' }}
    secrets:
      demoapp_api_key: ${{ secrets.DEMOAPP_API_KEY }}
