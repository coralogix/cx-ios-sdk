name: CI

# Single entry point for pull requests and master. Every check below is a
# reusable workflow so the same job definitions serve CI, nightly and manual
# runs, and `ci-passed` is the one status branch protection needs to require.

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded PR pushes are cancelled; master runs are keyed by SHA so each
  # commit's result is preserved.
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  component-unit:
    uses: ./.github/workflows/ci-component-unit.yml

  ui-tests:
    # All three tiers gate every PR, so there is no scheduled run — this is the
    # only thing that executes the UI suite. soak is split one-test-per-shard
    # because paired the two leak probes were a single ~8.8m shard; even split
    # they are the slowest jobs here (6.9m and 9.5m measured), so they set the
    # critical path rather than riding under it.
    uses: ./.github/workflows/ci-ui-tests.yml
    with:
      tiers: '["component","smoke","soak"]'
    secrets:
      demoapp_api_key: ${{ secrets.DEMOAPP_API_KEY }}

  podspec-lint:
    uses: ./.github/workflows/ci-podspec-lint.yml

  ci-passed:
    name: ci-passed
    # The real gate. Runs even when something upstream fails so it always
    # reports rather than being skipped into a pending state.
    if: always()
    needs: [component-unit, ui-tests, podspec-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all CI jobs passed
        # Derived from the whole `needs` object rather than a hand-listed set of
        # `<job>.result` checks, which would need updating twice per new job.
        # `skipped` passes; only `failure` and `cancelled` fail the gate.
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS_JSON"
          failed=$(echo "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')
          if [ -n "$failed" ]; then
            echo "::error::Failed or cancelled jobs: $(echo "$failed" | tr '\n' ' ')"
            exit 1
          fi
          echo "All required jobs passed (or were skipped)."

  # Compatibility shim — mirrors ci-passed under the name master's branch
  # protection still requires ("Run DemoApp UI Tests", the job name from the
  # ui-tests.yml this workflow replaces).
  #
  # Required checks are AND-ed and GitHub has no "any of" semantics, so while PRs
  # based on the old master are still open, the gate cannot simply be renamed:
  # requiring both names would block every PR, and requiring only the new one
  # would strand the old PRs until they rebased. Reporting under both names costs
  # one ubuntu job and keeps `ci-passed` honestly named.
  #
  # Delete this job once protection points at ci-passed:
  #   gh api -X PATCH repos/coralogix/cx-ios-sdk/branches/master/protection/required_status_checks \
  #     -F strict=true -f 'contexts[]=ci-passed'
  legacy-required-check:
    name: Run DemoApp UI Tests
    if: always()
    needs: ci-passed
    runs-on: ubuntu-latest
    steps:
      - name: Mirror the ci-passed result
        env:
          GATE: ${{ needs.ci-passed.result }}
        run: |
          set -euo pipefail
          echo "ci-passed = $GATE"
          # Anything other than success — failure, cancelled, or skipped — must
          # not report green under the required name.
          [ "$GATE" = "success" ] || { echo "::error::ci-passed did not succeed (result: $GATE)"; exit 1; }
          echo "Gate satisfied."
