name: Podspec Lint

permissions:
  contents: read

concurrency:
  group: podspec-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  workflow_dispatch:

jobs:
  # The three lints are independent `pod lib lint` invocations (each is
  # self-contained; --include-podspecs supplies the local dependency), so run
  # them in parallel instead of serially. Wall-clock drops from Σ(all lints)
  # to max(single lint).
  lint-spec:
    name: Lint ${{ matrix.name }}
    runs-on: macos-14
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CoralogixInternal
            spec: CoralogixInternal.podspec
            extra: ""
          - name: SessionReplay
            spec: SessionReplay.podspec
            extra: "--include-podspecs=CoralogixInternal.podspec"
          - name: Coralogix
            spec: Coralogix.podspec
            extra: "--include-podspecs=CoralogixInternal.podspec"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 15.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.3'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install CocoaPods
        run: |
          gem install cocoapods -v 1.16.2 --no-document
          pod --version

      - name: Print environment
        run: |
          set -e
          xcodebuild -version
          ruby -v
          pod env

      - name: Lint ${{ matrix.spec }}
        run: |
          set -euo pipefail
          echo "🔍 Linting ${{ matrix.spec }} (iOS, static frameworks)…"
          pod lib lint ${{ matrix.spec }} \
            ${{ matrix.extra }} \
            --platforms=iOS \
            --use-static-frameworks \
            --allow-warnings \
            --fail-fast \
            --no-clean \
            --verbose 2>&1 | tee "lint_${{ matrix.name }}.log"
          echo "✅ ${{ matrix.spec }} passed lint."

      - name: Show lint error summary (if any)
        if: failure()
        run: |
          echo "---- First error in ${{ matrix.name }} lint log ----"
          awk '/❌/{flag=1} flag{print; if (/^$/) exit}' "lint_${{ matrix.name }}.log" || true
          echo "----------------------------------------------------"

      - name: Upload lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podspec-lint-log-${{ matrix.name }}
          path: lint_${{ matrix.name }}.log
          if-no-files-found: ignore

  # Aggregator: re-emits the single "lint" status context so existing
  # branch-protection rules stay satisfied without the old serial job. Passes
  # only if every podspec in the matrix passed.
  lint:
    name: lint
    needs: [lint-spec]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "lint-spec=${{ needs.lint-spec.result }}"
          if [ "${{ needs.lint-spec.result }}" = "success" ]; then
            echo "✅ all podspecs linted"
          else
            echo "❌ a podspec lint failed"
            exit 1
          fi
