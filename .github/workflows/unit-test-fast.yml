name: Unit Tests (fast — cached)

# A/B variant of unit-test.yml. Same three SPM test targets, same serial
# execution (SDK swizzles global process state, so -parallel-testing-enabled NO
# stays), but:
#   - caches SPM checkouts (plcrashreporter) keyed on Package.resolved
#   - caches DerivedData for incremental compile (restore-keys fallback)
#   - drops `clean` (fresh runner has nothing to clean; it only forces a full rebuild)
#   - picks the simulator via simctl instead of the slow `-showdestinations` probe
# Kept side-by-side to compare wall-clock before replacing unit-test.yml.

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: unit-tests-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_16.2.app/Contents/Developer" >> $GITHUB_ENV
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_16.1.app/Contents/Developer" >> $GITHUB_ENV
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_16.0.app/Contents/Developer" >> $GITHUB_ENV
          fi

      - name: Configure Xcode
        run: |
          if [ -n "${DEVELOPER_DIR:-}" ]; then sudo xcode-select -s "$DEVELOPER_DIR"; fi
          xcodebuild -version

      - name: Install xcpretty
        run: gem install xcpretty || true

      # plcrashreporter checkout — small, pinned by Package.resolved, reliable win.
      - name: Cache SPM checkouts
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-xc16-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-xc16-

      # DerivedData — incremental compile. restore-keys pulls the newest bundle
      # even when sources change, so xcodebuild rebuilds only what moved.
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: .derivedData
          key: dd-${{ runner.os }}-xc16-${{ hashFiles('**/Sources/**/*.swift', 'Tests/**/*.swift', 'Package.resolved') }}
          restore-keys: |
            dd-${{ runner.os }}-xc16-

      - name: Pick an iPhone simulator (fast, no SPM resolution)
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries[]
            | select(.key | test("SimRuntime.iOS-1[789]|SimRuntime.iOS-2[0-9]"))
            | .value[] | select(.name | test("iPhone")) | .udid' | head -1)
          if [ -z "$UDID" ]; then echo "❌ no iOS iPhone simulator available"; exit 1; fi
          xcrun simctl boot "$UDID" 2>/dev/null || true
          echo "SIM_ID=$UDID" >> $GITHUB_ENV
          echo "✅ simulator $UDID"

      - name: Build & run unit tests (cached, no clean)
        run: |
          set -o pipefail
          START=$(date +%s)
          set +e
          xcodebuild test \
            -scheme Coralogix-Package \
            -destination "platform=iOS Simulator,id=${SIM_ID}" \
            -derivedDataPath .derivedData \
            -clonedSourcePackagesDirPath SourcePackages \
            -parallel-testing-enabled NO \
            -skipPackagePluginValidation \
            2>&1 | tee test-output.log | xcpretty
          EXIT=${PIPESTATUS[0]}
          set -e
          END=$(date +%s)
          TOTAL=$((END - START))

          if grep -q "TEST SUCCEEDED" test-output.log || grep -Eq "Executed [0-9]+ tests, with 0 failures" test-output.log; then
            STATUS="passed"
          else
            STATUS="failed"
          fi

          {
            echo "### Unit Tests (fast — cached)"
            echo ""
            echo "| build+test wall-clock | status |"
            echo "|---|---|"
            echo "| ${TOTAL}s (~$((TOTAL/60))m) | ${STATUS} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUS" != "passed" ]; then
            echo "❌ unit tests failed"
            grep -iE "error:|failed|failure" test-output.log | tail -30 || true
            exit "${EXIT:-1}"
          fi
          echo "✅ unit tests passed in ${TOTAL}s"